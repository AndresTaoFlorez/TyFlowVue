<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Rounded square background -->
  <rect width="36" height="36" rx="8" fill="#2AC78F"/>
  <!-- Stylized "T" with flow curves -->
  <!-- Top bar of T -->
  <path d="M8 11h20" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Vertical stem that curves into a flow -->
  <path d="M18 11v8c0 4-3 6-6 8" stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Flow branch going right -->
  <path d="M18 19c0 3 3 5 7 6" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Small dot accent at flow ends -->
  <circle cx="12" cy="27" r="2" fill="white" opacity="0.9"/>
  <circle cx="25" cy="25" r="1.6" fill="white" opacity="0.6"/>
</svg>
