<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TyFlow - Panel de gestión de usuarios, roles y áreas">
    <title>TyFlow Vue</title>
  </head>
  <body>
    <div id="app">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f6fa;margin:0">
        <svg width="40" height="40" viewBox="0 0 24 24" style="animation:spin .8s linear infinite">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#2AC78F" stroke-width="3" stroke-dasharray="50 20" stroke-linecap="round"/>
        </svg>
      </div>
      <style>body{margin:0;overflow:hidden}@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
