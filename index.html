<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TyFlow - Panel de gestión de usuarios, roles y áreas">
    <title>TyFlow Vue</title>
    <style>
      body { margin: 0; overflow: hidden; }
      #splash {
        position: fixed; inset: 0;
        background: #f5f6fa;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
      }
      #splash canvas {
        position: absolute; inset: 0; width: 100%; height: 100%;
      }
      #splash svg {
        position: relative; z-index: 1;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="splash">
        <canvas id="splash-canvas"></canvas>
        <svg width="40" height="40" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#2AC78F" stroke-width="3" stroke-dasharray="50 20" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <script>
    // Animación de nodos inline (versión compacta para el splash)
    ;(function() {
      var c = document.getElementById('splash-canvas')
      var ctx = c.getContext('2d')
      var cr = 42, cg = 199, cb = 143
      var dpr = window.devicePixelRatio || 1
      var w, h, nodes = [], animId, time = 0
      var connectDist = 160, connectDist2
      var speed = 0.3, minR = 1.5, maxR = 4
      var lineAlpha = 0.25, haloAlpha = 0.1

      function resize() {
        w = window.innerWidth; h = window.innerHeight
        c.width = w * dpr; c.height = h * dpr
        c.style.width = w + 'px'; c.style.height = h + 'px'
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
        var diag = Math.sqrt(w * w + h * h)
        var scale = diag / 1600
        connectDist = 220 * scale
        connectDist2 = connectDist * connectDist
        var target = Math.min(48, Math.max(6, Math.round(24 * scale)))
        while (nodes.length < target) nodes.push(makeNode())
        if (nodes.length > target) nodes.length = target
      }

      function makeNode() {
        var r = minR + Math.random() * (maxR - minR)
        var n = {
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - .5) * speed * 2,
          vy: (Math.random() - .5) * speed * 2,
          r: r, po: Math.random() * Math.PI * 2, hc: null
        }
        // Pre-render halo sprite
        var sz = Math.ceil(r * 1.25 * 4 * 2) + 2
        var oc = document.createElement('canvas')
        oc.width = sz; oc.height = sz
        var octx = oc.getContext('2d')
        var cx = sz / 2
        var grad = octx.createRadialGradient(cx, cx, 0, cx, cx, sz / 2)
        grad.addColorStop(0, 'rgba(' + cr + ',' + cg + ',' + cb + ',' + haloAlpha + ')')
        grad.addColorStop(1, 'rgba(' + cr + ',' + cg + ',' + cb + ',0)')
        octx.fillStyle = grad
        octx.fillRect(0, 0, sz, sz)
        n.hc = oc
        return n
      }

      function draw() {
        time += 0.016
        ctx.clearRect(0, 0, w, h)
        var i, j, n, m, dx, dy, d2, t

        // Move
        for (i = 0; i < nodes.length; i++) {
          n = nodes[i]
          n.x += n.vx; n.y += n.vy
          if (n.x < 20 || n.x > w - 20) n.vx = -n.vx
          if (n.y < 20 || n.y > h - 20) n.vy = -n.vy
          n.vx += (Math.random() - .5) * 0.02
          n.vy += (Math.random() - .5) * 0.02
          var sp = n.vx * n.vx + n.vy * n.vy
          if (sp > speed * speed) {
            var f = speed / Math.sqrt(sp)
            n.vx *= f; n.vy *= f
          }
        }

        // Lines (simple O(n²) — few nodes, short lived)
        ctx.lineWidth = 1
        for (i = 0; i < nodes.length; i++) {
          for (j = i + 1; j < nodes.length; j++) {
            n = nodes[i]; m = nodes[j]
            dx = n.x - m.x; dy = n.y - m.y
            d2 = dx * dx + dy * dy
            if (d2 < connectDist2) {
              t = 1 - d2 / connectDist2
              ctx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (t * lineAlpha).toFixed(3) + ')'
              ctx.beginPath()
              ctx.moveTo(n.x, n.y)
              ctx.lineTo(m.x, m.y)
              ctx.stroke()
            }
          }
        }

        // Halos
        for (i = 0; i < nodes.length; i++) {
          n = nodes[i]
          var pulse = 1 + Math.sin(time * 2 + n.po) * 0.25
          var hs = n.r * pulse * 4 * 2
          if (n.hc) ctx.drawImage(n.hc, n.x - hs / 2, n.y - hs / 2, hs, hs)
        }

        // Solid cores
        ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.7)'
        ctx.beginPath()
        for (i = 0; i < nodes.length; i++) {
          n = nodes[i]
          var pulse2 = 1 + Math.sin(time * 2 + n.po) * 0.25
          var rd = n.r * pulse2
          ctx.moveTo(n.x + rd, n.y)
          ctx.arc(n.x, n.y, rd, 0, 6.2832)
        }
        ctx.fill()

        animId = requestAnimationFrame(draw)
      }

      resize()
      window.addEventListener('resize', resize)
      draw()

      // Expose cleanup for Vue to call on mount
      window.__splashCleanup = function() {
        cancelAnimationFrame(animId)
        window.removeEventListener('resize', resize)
        var splash = document.getElementById('splash')
        if (splash) splash.remove()
      }
    })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
