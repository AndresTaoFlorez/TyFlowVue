name: Deploy TyFlowVue

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Deploy TyFlowVue
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Clean remote directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -rf /home/pages/fd_tyflow
            mkdir -p /home/pages/fd_tyflow

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/home/pages/fd_tyflow"

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/pages/fd_tyflow
            docker build \
              --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} \
              -t tyflow-vue .
            docker stop tyflow-vue || true
            docker rm tyflow-vue || true
            docker run -d \
              --name tyflow-vue \
              -p 8182:8182 \
              --restart unless-stopped \
              tyflow-vue
